services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: deskit-postgres
    environment:
      POSTGRES_DB: deskit
      POSTGRES_USER: deskit
      POSTGRES_PASSWORD: deskit
    ports:
      - "5432:5432"
    volumes:
      - deskit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskit -d deskit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: deskit-redis
    ports:
      # Host 6380 avoids clashing with a system Redis on 6379
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: deskit-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose-network overrides (hostnames differ from .env on the host machine)
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/deskit
      DATABASE_USERNAME: deskit
      DATABASE_PASSWORD: deskit
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8080:8080"

volumes:
  deskit_pg_data:
