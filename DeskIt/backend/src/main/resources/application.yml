spring:
  application:
    name: deskit-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Empty DBs: baseline at 0 so V1 actually runs. Default baseline-version=1
    # skips V1 and breaks later migrations that need deskit_schema_meta.
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

deskit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  harden:
    postgis-sync-enabled: ${DESKIT_POSTGIS_SYNC_ENABLED:true}
    temp-assignment-expiry-cron: "0 */1 * * * *"
    idempotency-ttl: 24h
    idempotency-lock-ttl: 30s
  rate-limit:
    enabled: ${DESKIT_RATE_LIMIT_ENABLED:true}
    requests-per-window: ${DESKIT_RATE_LIMIT_RPM:120}
    window: 1m
    auth-requests-per-window: ${DESKIT_RATE_LIMIT_AUTH_RPM:20}
  ops:
    open-api-public: ${DESKIT_OPENAPI_PUBLIC:true}
    prometheus-public: ${DESKIT_PROMETHEUS_PUBLIC:false}
  security:
    default-role: EMPLOYEE
    dev-login-enabled: false
    admin-email-allowlist:
      - marcus.vance@deskit.io
    role-mapping:
      microsoft:
        DeskIt-Admins: ADMIN
        DeskIt-HR: HR
      okta:
        DeskIt-Admins: ADMIN
        DeskIt-HR: HR
      google:
        DeskIt-Admins: ADMIN
        DeskIt-HR: HR
    jwt:
      secret: ${APP_JWT_SECRET:change-me-deskit-phase1-jwt-secret-key-32b-min}
      issuer: deskit-backend
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    oauth2:
      frontend-redirect-url: ${FRONTEND_AUTH_REDIRECT_URL:http://localhost:5173/auth/callback}

# Optional OIDC client registrations (set via .env)
# spring.security.oauth2.client.registration.microsoft.client-id=${OIDC_ENTRA_CLIENT_ID}
# spring.security.oauth2.client.registration.microsoft.client-secret=${OIDC_ENTRA_CLIENT_SECRET}
# spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
# spring.security.oauth2.client.provider.microsoft.issuer-uri=https://login.microsoftonline.com/${OIDC_ENTRA_TENANT_ID}/v2.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.deskit: INFO
    org.springframework.security: INFO
